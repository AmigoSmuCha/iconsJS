name: Build APK

# Every push to the main branch builds the app and publishes it as a release,
# so the newest iconJS.apk is always under "Releases" (also in the GitHub app).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: bash build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v1.${{ github.run_number }}
        run: |
          gh release create "$TAG" build/iconJS.apk \
            --target "$GITHUB_SHA" \
            --title "iconJS 1.${{ github.run_number }}" \
            --notes "Download iconJS.apk below and open it to install. It installs over the previous version."
